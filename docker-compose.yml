# Pila MVP de solidAPP: arranca backend, frontend, postgres+postgis, redis
# y los workers Celery. Todo se construye en local; nada requiere pip/npm
# en el host Windows.
#
# Uso:
#   docker compose up -d
#   docker compose exec backend alembic upgrade head
#   docker compose exec backend python -m app.scripts.seed
#   http://localhost:5173   → frontend Vite
#   http://localhost:8000   → Swagger / OpenAPI

services:

  # ── Base de datos ─────────────────────────────────────────────────────
  db:
    # T-101 (2026-10-23): ``restart: unless-stopped`` en TODOS los
    # servicios. Antes db, redis, backend, frontend, celery-worker y
    # celery-beat NO lo tenian: si uno se caia (un OOM, un SIGKILL), se
    # quedaba caido hasta que alguien lo levantara a mano. En el worker
    # es lo mas grave: con ``acks_on_failure_or_timeout`` (que ya es el
    # defecto) las tareas perdidas no se reintentan, el beat sigue
    # publicando cada 60 s y la cola de Redis crece sin que nadie la
    # consuma.
    restart: unless-stopped
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: parking
      POSTGRES_PASSWORD: parking
      POSTGRES_DB: parking
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/seed.sql:/docker-entrypoint-initdb.d/01-postgis.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parking -d parking"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      # SÓLO loopback (2026-10-21): este compose es también el que se
      # copia a una sucursal (ADR-0001, opción D: Compose en el edge), y
      # con "5432:5432" la base de datos quedaba escuchando en la red
      # de la sucursal con la contraseña "parking" escrita en un
      # repositorio público. La base NO necesita ser accesible desde
      # fuera: los servicios se hablan por la red de Docker
      # ("db:5432") y el host sigue entrando por 127.0.0.1.
      - "127.0.0.1:5432:5432"

  # ── Cola + cache + scheduler ─────────────────────────────────────────
  redis:
    restart: unless-stopped
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    ports:
      # SÓLO loopback (2026-10-21): Redis no tiene contraseña y aquí
      # vive la blacklist de tokens y el estado de sesión. Con
      # "6379:6379" cualquier equipo de la red de la sucursal podía
      # leerlo e invalidar tokens ajenos. Por dentro los servicios
      # siguen hablándose por la red de Docker.
      - "127.0.0.1:6379:6379"

  # ── Servicio OCR (PaddleOCR separado) ─────────────────────────────────
  # Mantiene PaddleOCR aislado del backend (~1.5 GB de imagen sólo aquí).
  # El backend le envía frames por HTTP. Los modelos se cachean en el
  # volumen 'ocr_models' para no re-descargarlos cada arranque.
  # Solo el puerto 8801 se publica al host para debug manual con curl.
  ocr:
    build:
      context: ./docker/ocr
      dockerfile: Dockerfile
    image: solidapp-ocr:latest
    environment:
      OCR_ENGINE: paddle
      OCR_PORT: "8800"
      OCR_LANG: en
      OCR_MODELS_DIR: /models
    volumes:
      - ocr_models:/models
    ports:
      # SÓLO loopback (2026-10-21): es un servicio interno del backend
      # (el backend le manda los frames). El puerto se publica para
      # depurar a mano con curl, no para que lo use la red.
      - "127.0.0.1:8801:8800"
    restart: unless-stopped

  # ── Servicio vehicle-detector (Ultralytics YOLO separado) ─────────────
  # Sprint Vehicle-Detect (2026-07-07): detector cenital de vehículos
  # (pre-flight check de calibración de geocercas). Mantiene torch +
  # ultralytics aislados del backend. El modelo yolov8n.pt (~6 MB) se
  # cachea en el volumen 'vehicle_models' para no re-descargarlo cada
  # arranque. Sin depends_on: si está caído, el cliente hace fallback
  # silencioso y devuelve detections=[].
  vehicle-detector:
    build:
      context: ./docker/vehicle-detector
      dockerfile: Dockerfile
    image: solidapp-vehicle-detector:latest
    environment:
      VD_PORT: "8800"
      VD_MODEL: "best.pt"
      # Sprint Vehicle-Detect v2 (2026-07-07): yolov8m fine-tuned en
      # VisDrone (dronefreak/visdrone-yolov8m en HuggingFace). NO es
      # un asset oficial de Ultralytics → el servicio lo descarga la
      # primera vez y lo cachea en el volumen vehicle_models.
      VD_MODEL_URL: "https://huggingface.co/dronefreak/visdrone-yolov8m/resolve/main/best.pt"
      VD_MODELS_DIR: /models
      # Sprint Vehicle-Detect v2: con yolov8m-visdrone subimos de 0.05 → 0.25.
      # VisDrone discrimina bien vehículos vs fondo, no necesitamos recall
      # agresivo. Umbral 0.25 = balance precision/recall.
      VD_CONFIDENCE_THRESHOLD: "0.25"
    volumes:
      - vehicle_models:/models
    ports:
      # SÓLO loopback (2026-10-21): servicio interno del backend.
      - "127.0.0.1:8802:8800"
    restart: unless-stopped

  # ── API FastAPI ──────────────────────────────────────────────────────
  backend:
    # T-101 (2026-10-23): ver la nota del servicio ``db``. Si el backend
    # se cae (un OOM al generar un informe enorme, un bug), Docker lo
    # levanta solo.
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: solidapp-backend:latest
    environment:
      DATABASE_URL: postgresql+psycopg://parking:parking@db:5432/parking
      ASYNC_DATABASE_URL: postgresql+asyncpg://parking:parking@db:5432/parking
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      ENVIRONMENT: development
      # T-176 (2026-10-24): en DESARROLLO el limite de intentos de login
      # es 50, no 10. Motivo: las puertas de QA (QAS de navegador) hacen
      # varios inicios de sesion seguidos desde la misma IP (el proxy de
      # Vite), y con el valor de produccion (10 por IP cada 5 minutos) se
      # pisan entre ellas y fallan con un 429 que no tiene nada que ver
      # con lo que vigilan. En PRODUCCION sigue siendo 10: este cambio va
      # solo en el compose de desarrollo.
      LOGIN_RATE_LIMIT_MAX_ATTEMPTS: "50"
      # URL publica del frontend: la que va en los correos (el de recuperar
      # contrasena). En staging/produccion tiene que ser una URL real por
      # HTTPS: con el valor por defecto la API no arranca (T-61).
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:5173}
      # IP de los proxies de confianza (los que pueden poner el
      # X-Forwarded-For). Si el proxy de produccion esta fuera de los
      # rangos por defecto, hay que anadirlo aqui: si no, el backend ve
      # la IP del proxy y el rate-limit de login se comparte para toda la
      # sucursal (T-62 y T-64).
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.16.0.0/12,10.0.0.0/8}
      # Cliente OCR (Fase 2). Si el servicio 'ocr' no está levantado,
      # el cliente hace fallback silencioso y devuelve [] — NUNCA 500.
      OCR_SERVICE_URL: http://ocr:8800
      OCR_SERVICE_TIMEOUT: "4"
      # Preview MJPEG en vivo: fps objetivo del preview. 5 fps por defecto
      # (decisión D1 del plan de pendientes): la latencia sigue por debajo
      # de 400 ms y ahorra ~85 % de CPU y ancho de banda frente al flujo
      # libre. Poner 0 (o un valor no positivo) = SIN limitador, el preview
      # va tan rápido como la cámara y la red permitan.
      LIVE_PREVIEW_FPS: "${LIVE_PREVIEW_FPS:-5}"
      # T-23 (2026-10-21): reconocimiento facial PREPARADO pero FUERA del
      # MVP. Con el flag apagado (valor por defecto) el endpoint de
      # plantillas devuelve 404 y la autenticación sigue siendo
      # usuario+contraseña.
      FACE_TEMPLATES_ENABLED: "${FACE_TEMPLATES_ENABLED:-false}"
      # Cliente vehicle-detector (Sprint Vehicle-Detect 2026-07-07). Mismo
      # patrón fail-OPEN que OCR: si el contenedor YOLO está caído, el
      # cliente devuelve detections=[] y el endpoint responde 200 con [].
      VEHICLE_DETECTOR_URL: http://vehicle-detector:8800
      VEHICLE_DETECTOR_TIMEOUT: "8"
      # T-21 (plan maestro 2026-10-21): fotos adjuntas a los incidentes.
      # El binario NO va a la base de datos: vive en este volumen local
      # con el nombre derivado del hash del contenido; en la BD sólo
      # queda la metadata. Retención por defecto: 90 días.
      INCIDENT_ATTACHMENTS_DIR: /var/lib/solidapp/incident-attachments
      INCIDENT_ATTACHMENT_MAX_BYTES: "10485760"
      INCIDENT_ATTACHMENT_MAX_FILES: "3"
      INCIDENT_ATTACHMENT_RETENTION_DAYS: "90"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ocr:
        condition: service_started
      vehicle-detector:
        condition: service_started
    ports:
      # T-94 (2026-10-23): solo en el bucle local. Antes era
      # "8000:8000" (0.0.0.0): la API quedaba **alcanzable desde la
      # red de la sucursal**, saltandose nginx y con el unico limite de
      # cuerpo que hay (el de nginx: 32 MB). Dentro de la red de Docker
      # se sigue hablando por el nombre del servicio ("backend:8000"),
      # que es como lo hace el proxy de nginx y el worker de Celery.
      - "127.0.0.1:8000:8000"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./backend:/app
      - app_logs:/var/log/solidapp
      # Fotos de los incidentes (T-21). Volumen con nombre: sobrevive a
      # `docker compose down` y a la recreation del contenedor.
      - incident_attachments:/var/lib/solidapp/incident-attachments

  # ── Frontend Vue 3 (Vite dev) ────────────────────────────────────────
  frontend:
    restart: unless-stopped
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: solidapp-frontend:latest
    environment:
      # Solo la usa vite.config.ts en el proxy de /api. No se exporta al
      # bundle porque su nombre no empieza por VITE_*.
      VITE_PROXY_TARGET: http://backend:8000
    depends_on:
      - backend
    ports:
      # T-94 (2026-10-23): igual que el backend, solo en el bucle local.
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    healthcheck:
      # El dev-server de Vite es el que sirve la app: si responde, el
      # frontend está en pie. Sin este healthcheck, `docker compose ps`
      # no lo marcaba como healthy y el stack entero nunca aparecía
      # "todo healthy" (que es lo que exige la definición de hecho del
      # plan). La imagen es node:20-alpine, así que el probe es `wget` de
      # busybox, no `curl`.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5173/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ── Celery worker ────────────────────────────────────────────────────
  # El healthcheck del Dockerfile del backend (curl :8000) se sobreescribe
  # aquí porque el worker NO expone el puerto HTTP: el probe real es
  # `celery inspect ping` contra el propio broker.
  celery-worker:
    # T-101: sin esto, un worker muerto se queda muerto (y el beat sigue
    # publicando: la cola crece y no hay ni alertas ni deteccion de
    # camaras caidas).
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/celery/Dockerfile
    image: solidapp-backend:latest
    environment:
      DATABASE_URL: postgresql+psycopg://parking:parking@db:5432/parking
      ASYNC_DATABASE_URL: postgresql+asyncpg://parking:parking@db:5432/parking
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      OCR_SERVICE_URL: http://ocr:8800
      OCR_SERVICE_TIMEOUT: "4"
      # T-141 (2026-10-24): la purga de adjuntos corre en el worker, y el
      # worker tiene que ver **el mismo volumen** que el backend. Sin esto
      # (o sin el montaje de mas abajo) Docker le creaba un volumen
      # ANONIMO: la purga borraba las filas y decia `deleted: N` pero los
      # ficheros se quedaban en el disco del backend, para siempre, y sin
      # que nadie se enterase (la retencion no se cumplia).
      INCIDENT_ATTACHMENTS_DIR: /var/lib/solidapp/incident-attachments
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOKI_URL: ${LOKI_URL:-http://loki:3100}
    depends_on:
      backend:
        condition: service_started
    volumes:
      - ./backend:/app
      - app_logs:/var/log/solidapp
      # T-141 (2026-10-24): el MISMO volumen con nombre que el backend
      # monta. Sin este montaje, el `VOLUME` del Dockerfile hace que Docker
      # cree un volumen ANONIMO distinto en cada servicio: el worker
      # borraba filas que no podia ver y los ficheros se quedaban
      # huérfanos en el disco del backend (retencion incumplida).
      - incident_attachments:/var/lib/solidapp/incident-attachments
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=info"]
    healthcheck:
      # El ping es un comando de control: lo responde un worker cuando
      # tiene un slot libre del pool. Con la ronda de heartbeat
      # sondeando 50 cámaras, ese slot puede tardar (T-13+4 la ha
      # paralelizado, pero sigue habiendo margen). Con `-t 5` y un
      # timeout de 10 s el contenedor pasaba a *unhealthy* de forma
      # intermitente, y en Swarm/K8s eso significa **reemplazar el
      # worker en bucle**. El margen debe ser MAYOR que el timeout del
      # propio inspect, o el healthcheck mata al contenedor que
      # responde tarde.
      test: ["CMD", "celery", "-A", "app.workers.celery_app", "inspect", "ping", "-t", "20"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 30s

  # ── Celery beat (scheduler) ──────────────────────────────────────────
  # El beat no responde a "ping": está vivo si el archivo celerybeat-schedule
  # se actualiza con cada tick. Probamos mtime < 120 s.
  celery-beat:
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/celery/Dockerfile
    image: solidapp-backend:latest
    environment:
      DATABASE_URL: postgresql+psycopg://parking:parking@db:5432/parking
      ASYNC_DATABASE_URL: postgresql+asyncpg://parking:parking@db:5432/parking
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      OCR_SERVICE_URL: http://ocr:8800
      OCR_SERVICE_TIMEOUT: "4"
      # T-141 (2026-10-24): la purga de adjuntos corre en el worker, y el
      # worker tiene que ver **el mismo volumen** que el backend. Sin esto
      # (o sin el montaje de mas abajo) Docker le creaba un volumen
      # ANONIMO: la purga borraba las filas y decia `deleted: N` pero los
      # ficheros se quedaban en el disco del backend, para siempre, y sin
      # que nadie se enterase (la retencion no se cumplia).
      INCIDENT_ATTACHMENTS_DIR: /var/lib/solidapp/incident-attachments
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOKI_URL: ${LOKI_URL:-http://loki:3100}
    depends_on:
      backend:
        condition: service_started
    volumes:
      - ./backend:/app
      - app_logs:/var/log/solidapp
      # T-141 (2026-10-24): el MISMO volumen con nombre que el backend
      # monta. Sin este montaje, el `VOLUME` del Dockerfile hace que Docker
      # cree un volumen ANONIMO distinto en cada servicio: el worker
      # borraba filas que no podia ver y los ficheros se quedaban
      # huérfanos en el disco del backend (retencion incumplida).
      - incident_attachments:/var/lib/solidapp/incident-attachments
    # T-145 (2026-10-24): el schedule del beat va a /var/lib/solidapp/, no
    # a /app. Motivo: en produccion el codigo ya NO viene montado desde el
    # host (eso era el defecto), asi que /app es el de la imagen, que es
    # de root y el proceso corre como `app`: ahi no se puede escribir y el
    # beat no arrancaria. /var/lib/solidapp es del usuario `app`.
    command: ["celery", "-A", "app.workers.celery_app", "beat", "--loglevel=info", "--schedule=/var/lib/solidapp/celerybeat-schedule"]
    healthcheck:
      # celerybeat-schedule vive en /var/lib/solidapp (ver el comando).
      #
      # T-186 (2026-10-25): el margen es de 10 minutos, no de 2. Medido:
      # el beat reescribe el fichero cada **195-300 s** (el sync de Celery va
      # detras de dormir, y se duerme hasta `beat_max_loop_interval`), asi que
      # con «-mmin -2» el contenedor pasaba **unhealthy 180 s de cada 300** y
      # luego volvia a healthy (parpadeo). En Swarm o K8s, unhealthy =
      # **reemplazar el contenedor en bucle** (el principio que el propio
      # compose enuncia mas arriba para el worker: el margen debe ser MAYOR
      # que el tiempo de respuesta real).
      #
      # OJO (el hueco que queda): este healthcheck mide al **escritor**
      # (que el beat siga vivo), NO al que despacha. Medido el 2026-10-25:
      # con el cambio de hora de verano (03:00 CEST -> 02:00 CET) el beat
      # dejo de despachar durante **una hora** y nadie se entero (su
      # fichero se seguia reescribiendo). Lo detecta el **central**, no el
      # healthcheck: ver el T-186 del plan.
      test: ["CMD-SHELL", "find /var/lib/solidapp/celerybeat-schedule -mmin -10 | grep -q ."]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── Observabilidad (Sprint Fase 3A, 2026-07-01) ──────────────────────
  # Loki + Promtail + Grafana como destino de los logs JSON estructurados
  # que el backend escribe en /var/log/solidapp/ (ver ``backend/Dockerfile``).
  loki:
    image: grafana/loki:2.9.0
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - loki-data:/loki
      - ./infra/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
    ports:
      # SÓLO loopback (2026-10-21): los logs de la sucursal no se
      # exponen a la red local.
      - "127.0.0.1:3100:3100"
    healthcheck:
      # OJO: el endpoint /ready de Loki devuelve 503 aunque el servicio
      # esté perfectamente en pie (por eso no se usa). /metrics responde
      # 200 mientras el servidor HTTP de Loki esté vivo, que es lo que
      # un healthcheck debe comprobar. La imagen es alpine: `wget` de
      # busybox, sin `curl`.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3100/metrics || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  promtail:
    image: grafana/promtail:2.9.0
    command: ["-config.file=/etc/promtail/promtail-config.yaml"]
    volumes:
      - ./infra/promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - app_logs:/var/log/solidapp:ro
    depends_on:
      - loki
    healthcheck:
      # Promtail no expone ningún endpoint HTTP (es un proceso que
      # empuja logs), y su imagen no trae `wget` ni `pgrep`. Lo que sí se
      # puede comprobar en la imagen es que el proceso que ejecuta el
      # contenedor es el promtail: si semuriera, el PID 1 dejaría de
      # ser promtail.
      test: ["CMD-SHELL", "grep -q promtail /proc/1/comm || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      # SÓLO loopback (2026-10-21): Grafana lleva la contraseña por
      # defecto "admin" y muestra los logs de la sucursal. Se abre por
      # túnel (ssh -L) o desde el propio host, no desde la red local.
      - "127.0.0.1:3000:3000"
    depends_on:
      - loki
    healthcheck:
      # /api/health responde 200 y trae el estado de su base de datos.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  backup:
    # T-154 (2026-10-24): el backup **con** las fotos de los incidentes.
    #
    # Antes el backup se lanzaba desde el host (el cron del README) y las
    # fotos **no se respaldaban**: ``backup.sh`` avisa y sigue si
    # ``ATTACHMENTS_DIR`` no existe, y desde el host la ruta del
    # contenedor no existe. O sea: el backup "salia bien" **sin las
    # fotos**, y al restaurar en otra maquina la base de datos decia que
    # estaban y los ficheros no (404). Y son datos personales (LOPDGDD).
    #
    # Este servicio monta **el mismo volumen** que el backend y define
    # ``ATTACHMENTS_DIR``. Con ``profiles`` no arranca en un ``up -d``
    # normal: se ejecuta a proposito (``docker compose run --rm backup``).
    image: postgis/postgis:16-3.4
    profiles: ["backup"]
    restart: "no"
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: parking
      PGPASSWORD: parking
      PGDATABASE: parking
      BACKUP_DIR: /backups
      # T-154: el directorio de los adjuntos (el mismo volumen que ve el
      # backend). Sin esto, el backup NO incluye las fotos.
      ATTACHMENTS_DIR: /var/lib/solidapp/incident-attachments
      BACKUP_RETENTION_DAYS: "${BACKUP_RETENTION_DAYS:-7}"
      BACKUP_RETENTION_WEEKS: "${BACKUP_RETENTION_WEEKS:-4}"
      BACKUP_RETENTION_MONTHS: "${BACKUP_RETENTION_MONTHS:-6}"
      # La passphrase de cifrado: fichero del host. Con el default (un
      # fichero vacio) el script falla ruidosamente: sin passphrase no hay
      # backup, y es mejor que un backup que nadie puede descifrar.
      BACKUP_PASSPHRASE_FILE: /run/secrets/backup.pass
    volumes:
      - ./infra/backup:/opt/solidapp/backup:ro
      # El MISMO volumen que el backend (T-141): si fuera otro, el backup
      # se llevaria un directorio de adjuntos vacio.
      - incident_attachments:/var/lib/solidapp/incident-attachments:ro
      - backups:/backups
      # La passphrase de cifrado: el directorio de secretos del host.
      # En el despliegue real es /etc/solidapp (con backup.pass dentro).
      - ${BACKUP_SECRETS_DIR:-/etc/solidapp}:/run/secrets:ro
    entrypoint: ["bash", "/opt/solidapp/backup/backup.sh"]

volumes:
  pgdata:
  redisdata:
  ocr_models:
  vehicle_models:
  loki-data:
  grafana-data:
  app_logs:
  # Fotos adjuntas a los incidentes (T-21). El binario vive aquí, no en
  # la base de datos.
  incident_attachments:
  # Los backups (volcado cifrado + tar de adjuntos) del T-154.
  backups:
