version: "3.8"
services:
  fastapi:
    build: .
    container_name: parking_fastapi
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db/postgresdb
    depends_on:
      - db
  db:
    image: postgres:15
    container_name: parking_db
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: parkingdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data:
