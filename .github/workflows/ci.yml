name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ── Backend: ruff + mypy + pytest (SQLite en memoria) ───────────────────
  # POR QUÉ este job ya NO levanta PostgreSQL: hasta el 2026-10-21 sí lo
  # hacía, pero la suite corría siempre contra SQLite (el motor estaba
  # hardcodeado en ``tests/conftest.py``) y el PostgreSQL del servicio se
  # quedaba sin usar. Esa pantalla fue justo lo que dejó pasar un
  # ``strftime()`` (función que sólo existe en SQLite) hasta producción.
  # Ahora el motor real lo prueba el job ``integration``.
  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 5

    env:
      # Motor de la BD de test: SQLite en memoria (rápido, sin servicios).
      # ``tests/conftest.py`` fuerza estas variables antes de importar la app.
      DATABASE_URL: "sqlite+pysqlite:///:memory:"
      ASYNC_DATABASE_URL: "sqlite+aiosqlite:///:memory:"
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      JWT_SECRET: ci-secret
      ENVIRONMENT: test

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: El texto versionado no está corrupto
        # POR QUÉ (2026-10-21): el modelo de lenguaje introduce con
        # facilidad caracteres de otros alfabetos (CJK, cirílico, coreano)
        # en el texto en español, y llegan hasta el commit. Se cuelan en
        # los docstrings, en los comentarios e incluso en un identificador
        # de JavaScript, donde rompen la vista con un 500 (pasó: una
        # tabla se quedó en blanco por un ``v-else`` mal colocado).
        #
        # Se comprueba ANTES de instalar dependencias: el escáner es sólo
        # biblioteca estándar, así que falla en dos segundos en vez de
        # esperar al ``pip install``. El modo ``--tracked`` escanea
        # exactamente lo versionado: ni ``node_modules``, ni ``dist``.
        run: python ../tools/escanear_texto.py --tracked --salida ../tools/_informe_texto.txt

      - name: El navegador para la autoprueba de la QA visual
        # POR QUÉ (2026-10-22): la autoprueba del detector de desbordes
        # evalúa el JavaScript en un Chromium de verdad (el JS mide
        # anchos de elementos, y eso sólo lo sabe un motor de layout).
        # Sin playwright, esa autoprueba no se puede comprobar, y el
        # paso siguiente fallaría con un ModuleNotFoundError.
        #
        # Se instala AQUÍ, antes de las autopruebas, y no en el
        # ``pip install -e ".[dev]"`` del backend, porque el job corre
        # las autopruebas ANTES de instalar el backend (para que fallen
        # en segundos y no después de un install largo).
        #
        # ``--with-deps`` sólo existe en Linux (instala las librerías
        # del sistema con apt). En Windows y macOS no hace falta.
        run: |
          pip install playwright
          if [ "$RUNNER_OS" = "Linux" ]; then
            python -m playwright install --with-deps chromium
          else
            python -m playwright install chromium
          fi

      - name: Las puertas se prueban a sí mismas
        # POR QUÉ (2026-10-22): los bugs más caros de este repositorio no
        # estaban en la aplicación, sino en las herramientas que la
        # describen o la miden: el extractor de RBAC que decía "Público"
        # en 9 endpoints de admin, el script de lint del frontend que
        # nunca funcionó, los healthcheck que no existían y el recuento
        # de endpoints que se quedó en 100 cuando ya eran 101. A todos les
        # faltaba lo mismo: **la puerta no tenía forma de demostrar que
        # detectaba lo que dice detectar**.
        #
        # Esta autoprueba comprueba que cada detector sigue detectando
        # su propia clase de defecto (y que NO dispara con los casos
        # legítimos). Si un detector deja de ver, el CI se pone rojo.
        #
        # ``--estricto``: si alguna autoprueba no se ha podido comprobar
        # (por falta de navegador), también es un fallo. Aquí todas
        # tienen que comprobarse de verdad.
        run: python ../tools/autopruebas.py --estricto

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Linter (ruff)
        # ``../tools`` entra también: las herramientas de ``tools/`` son
        # puertas del pipeline (inventario de la API, migraciones,
        # despliegue limpio, corrupcion de texto) y ningun linter las
        # miraba. Por ahi se colaron hasta tres fallos, uno de ellos un
        # ``NameError`` en el camino de error de ``tools/estado_ci.py``.
        run: ruff check app tests ../tools

      - name: Tipos (mypy)
        # POR QUÉ ya no es continue-on-error (2026-10-21): el backend
        # estaba en modo ``strict`` con 77 errores y la puerta lo toleraba
        # desde el primer commit. Los 77 están corregidos: ``mypy app``
        # sale con "no issues found" en Python 3.11 (la del CI) y en 3.13.
        # Ahora la puerta de verdad: si mypy se pone rojo, el CI se pone
        # rojo. Comprobado con el job replicado en local.
        run: mypy app

      - name: Tests (pytest, SQLite)
        run: pytest -q

  # ── Integration: la MISMA suite contra PostgreSQL ──────────────────────
  # POR QUÉ este job existe (T-04, 2026-10-21): es el que detecta los
  # bugs de dialecto SQL. ``strftime()`` (SQLite) pasó el CI durante
  # meses y en Docker devolvía HTTP 500. Con ``TEST_DATABASE_URL`` la
  # suite corre contra el motor de producción; el esquema lo crea y
  # destruye la propia sesión de tests (``Base.metadata``), sin Alembic.
  integration:
    name: Integration (pytest contra PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: parking
          POSTGRES_PASSWORD: parking
          POSTGRES_DB: parking_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U parking"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 5

    env:
      # ÉSTA es la variable que activa el motor real (la lee tests/conftest.py).
      TEST_DATABASE_URL: "postgresql+psycopg://parking:parking@localhost:5432/parking_test"
      DATABASE_URL: "postgresql+psycopg://parking:parking@localhost:5432/parking_test"
      ASYNC_DATABASE_URL: "postgresql+asyncpg://parking:parking@localhost:5432/parking_test"
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      JWT_SECRET: ci-secret
      ENVIRONMENT: test

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Tests contra PostgreSQL (pytest)
        run: pytest -q

      - name: Test de funciones sólo de SQLite
        run: pytest -q tests/test_sqlite_only_functions.py

      - name: El inventario de la API coincide con el código
        # POR QUÉ (2026-10-21): ``docs/API-INTERNAL.md`` documenta los
        # endpoints y su RBAC, y se genera desde los routers con
        # ``tools/generar_seccion_api.py``. Sin esta comprobación, un
        # endpoint nuevo (o un cambio de permisos) se colaba en el
        # código sin aparecer en el documento: ya pasó (el inventario
        # se quedó 38 endpoints atrás y además tenía dos rutas
        # registradas dos veces).
        run: python ../tools/verificar_api_doc.py

      - name: El frontend llama a endpoints que existen
        # POR QUÉ (2026-10-22): el frontend tiene su propio cliente HTTP
        # (``frontend/src/api/``) y la QA visual sólo recorre 26 pantallas.
        # Un endpoint mal escrito, o una ruta que el backend renombró,
        # se esconde hasta que un usuario llega a esa pantalla.
        #
        # Esta comprobación compara, de forma estática, cada ruta que el
        # cliente pide con las rutas que el backend expone, y avisa también
        # cuando la ruta existe pero con OTRO método.
        #
        # Sólo usa la biblioteca estándar (el extractor de la API parsea el
        # código con ``ast``), así que este paso no depende de las
        # dependencias del backend.
        run: python ../tools/verificar_contrato_frontend.py

      - name: El guard de rol del frontend coincide con el RBAC
        # POR QUÉ (2026-10-22): el router protege cada pantalla con
        # ``meta: { roles: [...] }`` y el backend protege cada endpoint
        # con ``require_role(...)``. Nada comparaba las dos listas.
        #
        # El síntoma del desajuste es silencioso: el router deja entrar
        # al gestor en una pantalla, la pantalla carga sus datos y el
        # backend responde 403. Desde el frontend no parece un problema
        # de permisos —la ruta existe y el método es el correcto—: sólo
        # el rol no encaja.
        #
        # Esta comprobación recorre las 22 pantallas con guard de rol,
        # sus componentes y sus llamadas (tanto las de los módulos de
        # ``@/api/`` como las escritas a mano con ``http.get(...)``), y
        # avisa si alguna llama a un endpoint que exige un rol que la
        # pantalla no contempla.
        run: python ../tools/verificar_roles_frontend.py

      - name: El seed, el login y la QA usan las mismas cuentas demo
        # POR QUÉ (2026-10-22): las credenciales de las cuentas demo están
        # escritas en TRES sitios (el seed, el mapa de ``fillDemo()`` del
        # login y las constantes de la QA visual) y nada las comparaba.
        # Si el seed cambia una contraseña, el usuario del demo no puede
        # entrar —con un "email o contraseña incorrectos" que no dice
        # nada— y la QA falla con un error de navegador que culpa al
        # navegador. Nadie pensaría mirar el seed.
        #
        # La puerta de "despliegue limpio" comprueba que el seed cree 4
        # usuarios, pero NO que sus contraseñas sean las que la pantalla
        # de login ofrece.
        run: python ../tools/verificar_cuentas_demo.py

      - name: La QA visual recorre todas las pantallas del router
        # POR QUÉ (2026-10-22): la QA visual recorre una lista de
        # pantallas escrita a mano, que es una COPIA de las rutas del
        # router. Nada las comparaba, y seis rutas no se revisaban nunca:
        # el dashboard de admin, la lista de parkings, la de costes y las
        # dos pantallas de error. Si cualquiera se hubiera roto, la QA
        # lo habría dado por bueno.
        #
        # Esta puerta comprueba que toda ruta del router se recorre, y
        # avisa de las que no (las que no se puedan recorrer tienen que
        # estar en la lista de exenciones de la herramienta, con su
        # motivo).
        run: python ../tools/verificar_cobertura_frontend.py

      - name: El frontend conoce todos los valores de los enums del backend
        # POR QUÉ (2026-10-22): el frontend replica a mano las
        # enumeraciones del backend, en muchos sitios: los mapas de
        # etiquetas de rol (dos copias), la lista de roles que el admin
        # asigna, el tipo ``role`` de la API (dos copias), el tipo
        # ``TicketStatus``, la función ``statusBadge()`` y el mapa de
        # tipos de alerta.
        #
        # Nada lo comparaba. Si el backend añade un rol, un tipo de
        # alerta o un estado de ticket, el frontend deja de poder
        # mostrarlo: la pantalla muestra un hueco y, en el caso de
        # ``statusBadge()``, dice "Anulado" a un ticket que no está
        # anulado (que es una afirmación falsa). Además, el desplegable
        # de "asignar rol" del admin no ofrecería el rol nuevo, así que
        # no se podría asignar desde la interfaz.
        run: python ../tools/verificar_enums_frontend.py

      - name: Las tareas de Celery se ejecutan de verdad
        # POR QUÉ (2026-10-22): una tarea de Celery puede existir, estar
        # REGISTRADA en el worker (eso es lo que dice "celery inspect
        # registered") y no ejecutarse NUNCA: basta con que no esté en el
        # beat_schedule y que nadie la despache.
        #
        # El caso real del repo: ``solidapp.ping_camera`` —la que agarra
        # el frame, lo manda al OCR y crea el ticket— no se despacha desde
        # junio de 2026. Tiene sus tests (que la llaman directamente, así
        # que pasan) y el código describía en dos comentarios un
        # comportamiento que no existía. Medido en la base de datos: la
        # última matrícula leída por el sistema es del 2026-06-30.
        #
        # Esta puerta lo dice en voz alta. Las tareas que no se ejecuten
        # a propósito tienen que estar en la lista de exenciones de la
        # herramienta, con su motivo.
        run: python ../tools/verificar_tareas_celery.py

      - name: Las migraciones y los modelos coinciden
        # POR QUÉ (2026-10-21): los tests crean el esquema con
        # ``Base.metadata.create_all``, es decir, **NO ejecutan las
        # migraciones**: una migración rota sólo se habría discovered en
        # producción. Aquí se levanta una base VACÍA, se migra de cero
        # y se comprueba con ``alembic check`` que el esquema resultante
        # coincide con los modelos.
        #
        # Esto ya encontró una deriva real: los modelos declaraban
        # cuatro índices que ninguna migración había creado, y la base
        # tenía cuatro restricciones UNIQUE redundantes que el modelo
        # no produce (migración 0014).
        # El script usa ``psycopg`` (dependencia del backend) y no
        # ``psql``, para que el paso no dependa del cliente de
        # PostgreSQL en la imagen.
        env:
          DATABASE_URL: "postgresql+psycopg://parking:parking@localhost:5432/solidapp_migraciones"
        run: python ../tools/verificar_migraciones.py

      - name: Despliegue limpio (migrar, sembrar y servir)
        # POR QUÉ (2026-10-21): nadie había probado el camino COMPLETO de
        # un despliegue nuevo. Las migraciones se ejecutaban sobre la
        # base de QA (ya sembrada) y el seed por separado, pero nunca
        # los tres juntos sobre una base VACÍA: un despliegue roto
        # (una migración que no aplica sobre el esquema limpio, o un
        # seed que usa una columna que ya no existe) sólo se habría
        # visto en el primer cliente.
        env:
          DATABASE_URL: "postgresql+psycopg://parking:parking@localhost:5432/solidapp_despliegue"
        run: python ../tools/verificar_despliegue_limpio.py

  # ── Build de las imágenes Docker ────────────────────────────────────────
  # POR QUÉ este job existe (T-05, 2026-10-21): el ``backend/Dockerfile``
  # estuvo roto mucho tiempo (``RUN mkdir -p /var/log/solidapp`` después
  # de ``USER app`` ⇒ *Permission denied*) y nadie se enteró porque el CI
  # NUNCA construía la imagen: instalaba el paquete con ``pip install -e``.
  # Además el comando de build local usaba ``| tail -40``, que se tragaba
  # el exit code. Aquí se construye sin pipe (con ``set -o pipefail``) y se
  # comprueba que el contenedor corre como el usuario no-root ``app`` y que
  # el RotatingFileHandler escribe en ``/var/log/solidapp/backend.log``.
  docker-build:
    name: Build de imágenes Docker
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Build de la imagen del backend
        run: |
          set -o pipefail
          docker build --tag solidapp-backend:ci backend/

      - name: El contenedor corre como el usuario no-root "app"
        run: |
          set -o pipefail
          usuario="$(docker run --rm --entrypoint id solidapp-backend:ci -un)"
          echo "usuario del contenedor: $usuario"
          test "$usuario" = "app"

      - name: El RotatingFileHandler escribe en /var/log/solidapp/backend.log
        run: |
          set -o pipefail
          docker run -d --name solidapp-log-check solidapp-backend:ci
          # Espera a que el backend arranque y escriba en el log rotado.
          for _ in $(seq 1 30); do
            if docker exec solidapp-log-check sh -c 'test -s /var/log/solidapp/backend.log'; then
              break
            fi
            sleep 1
          done
          docker exec solidapp-log-check sh -c '
            id
            ls -l /var/log/solidapp/backend.log
            cat /var/log/solidapp/backend.log
          '
          docker rm -f solidapp-log-check

      - name: Build de la imagen del frontend
        run: |
          set -o pipefail
          docker build --tag solidapp-frontend:ci frontend/

  # ── Frontend: type-check + build ──────────────────────────────────────
  # OJO (2026-10-22): aquí ya no hace falta el workaround de Node 20. Las
  # tres acciones del workflow corren en node24 (checkout@v5,
  # setup-python@v6, setup-node@v5), así que la variable
  # ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION, que autorizaba a ejecutar
  # versiones de Node **inseguras**, se ha quitado de los tres jobs.
  frontend:
    name: Frontend (vue-tsc, build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          # (2026-10-22): desde setup-node@v5, si el ``package.json`` trae
          # un campo ``packageManager``, la acción **activa el cache de npm
          # por su cuenta**. Aquí no lo queremos (el proyecto no tiene
          # ``packageManager`` y el cache apuntaría a un lock file que
          # antes no existía), así que se desactiva explícitamente.
          package-manager-cache: false

      - name: Instalar dependencias
        # OJO (2026-10-22): el comentario de setup-node de arriba decía que
        # NO había package-lock.json, pero sí lo hay (y está versionado).
        # ``npm ci`` es lo correcto: instala exactamente las versiones
        # fijadas. El ``|| npm install`` queda como red de seguridad por si
        # el lock file dejara de estar versionado algún día.
        run: npm ci || npm install

      - name: Linter (eslint)
        # POR QUÉ (2026-10-22): el ``package.json`` tenía un script
        # ``lint`` que **nunca funcionó** (ESLint 9 exige un
        # ``eslint.config.js`` y no había ninguno) y este job no lo
        # ejecutaba, así que el linter roto pasó desapercibido. Ahora hay
        # configuración plana (``frontend/eslint.config.js``) y el linter
        # es una puerta de verdad: sin errores y sin reglas de formato
        # (se usa ``flat/essential``, no ``flat/recommended``, que
        # obligaría a reformatear el frontend entero).
        run: npm run lint

      - name: Type-check (vue-tsc)
        run: npx vue-tsc --noEmit

      - name: Build
        run: npm run build
