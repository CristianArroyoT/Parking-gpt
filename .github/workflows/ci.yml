name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ── Backend: ruff + mypy + pytest (SQLite en memoria) ───────────────────
  # POR QUÉ este job ya NO levanta PostgreSQL: hasta el 2026-10-21 sí lo
  # hacía, pero la suite corría siempre contra SQLite (el motor estaba
  # hardcodeado en ``tests/conftest.py``) y el PostgreSQL del servicio se
  # quedaba sin usar. Esa pantalla fue justo lo que dejó pasar un
  # ``strftime()`` (función que sólo existe en SQLite) hasta producción.
  # Ahora el motor real lo prueba el job ``integration``.
  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 5

    env:
      # Sprint Fase 4 CI fix (2026-07-06): GH Actions deprecó Node 20 en
      # 2025-09-19 y fuerza Node 24. Las acciones @v4/@v5 targetean Node 20
      # → conflicto en cache de dependencias. Esta env var autoriza a las
      # acciones deprecadas a seguir corriendo en su versión original.
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
      # Motor de la BD de test: SQLite en memoria (rápido, sin servicios).
      # ``tests/conftest.py`` fuerza estas variables antes de importar la app.
      DATABASE_URL: "sqlite+pysqlite:///:memory:"
      ASYNC_DATABASE_URL: "sqlite+aiosqlite:///:memory:"
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      JWT_SECRET: ci-secret
      ENVIRONMENT: test

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Linter (ruff)
        run: ruff check app tests

      - name: Tipos (mypy)
        run: mypy app
        continue-on-error: true   # MVP: todavía hay pocos stubs

      - name: Tests (pytest, SQLite)
        run: pytest -q

  # ── Integration: la MISMA suite contra PostgreSQL ──────────────────────
  # POR QUÉ este job existe (T-04, 2026-10-21): es el que detecta los
  # bugs de dialecto SQL. ``strftime()`` (SQLite) pasó el CI durante
  # meses y en Docker devolvía HTTP 500. Con ``TEST_DATABASE_URL`` la
  # suite corre contra el motor de producción; el esquema lo crea y
  # destruye la propia sesión de tests (``Base.metadata``), sin Alembic.
  integration:
    name: Integration (pytest contra PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: parking
          POSTGRES_PASSWORD: parking
          POSTGRES_DB: parking_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U parking"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 5

    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
      # ÉSTA es la variable que activa el motor real (la lee tests/conftest.py).
      TEST_DATABASE_URL: "postgresql+psycopg://parking:parking@localhost:5432/parking_test"
      DATABASE_URL: "postgresql+psycopg://parking:parking@localhost:5432/parking_test"
      ASYNC_DATABASE_URL: "postgresql+asyncpg://parking:parking@localhost:5432/parking_test"
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      JWT_SECRET: ci-secret
      ENVIRONMENT: test

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Tests contra PostgreSQL (pytest)
        run: pytest -q

      - name: Test de funciones sólo de SQLite
        run: pytest -q tests/test_sqlite_only_functions.py

  # ── Frontend: type-check + build ──────────────────────────────────────
  frontend:
    name: Frontend (vue-tsc, build)
    runs-on: ubuntu-latest

    env:
      # Mismo workaround que backend: GH Actions deprecó Node 20 y la
      # acción @v4 de setup-node entra en conflicto con el runner Node 24.
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          # Sprint Fase 4 CI fix (2026-07-06): el proyecto usa `npm install`
          # (sin package-lock.json). Quitamos cache de npm porque apunta
          # a un archivo inexistente y rompe el step con 'Some specified
          # paths were not resolved'. Si en el futuro se migra a `npm ci`
          # con lock file, se puede reactivar.
          cache: ""

      - name: Instalar dependencias
        run: npm ci || npm install

      - name: Type-check (vue-tsc)
        run: npx vue-tsc --noEmit

      - name: Build
        run: npm run build
