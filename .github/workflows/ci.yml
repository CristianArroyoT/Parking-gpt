name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ── Backend: ruff + mypy + pytest ─────────────────────────────────────
  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: parking
          POSTGRES_PASSWORD: parking
          POSTGRES_DB: parking_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U parking"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 5

    env:
      # Sprint Fase 4 CI fix (2026-07-06): GH Actions deprecó Node 20 en
      # 2025-09-19 y fuerza Node 24. Las acciones @v4/@v5 targetean Node 20
      # → conflicto en cache de dependencias. Esta env var autoriza a las
      # acciones deprecadas a seguir corriendo en su versión original.
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
      DATABASE_URL: postgresql+psycopg://parking:parking@localhost:5432/parking_test
      ASYNC_DATABASE_URL: postgresql+asyncpg://parking:parking@localhost:5432/parking_test
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      JWT_SECRET: ci-secret
      ENVIRONMENT: test

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Linter (ruff)
        run: ruff check app tests

      - name: Tipos (mypy)
        run: mypy app
        continue-on-error: true   # MVP: todavía hay pocos stubs

      - name: Tests (pytest)
        run: pytest -q

  # ── Frontend: type-check + build ──────────────────────────────────────
  frontend:
    name: Frontend (vue-tsc, build)
    runs-on: ubuntu-latest

    env:
      # Mismo workaround que backend: GH Actions deprecó Node 20 y la
      # acción @v4 de setup-node entra en conflicto con el runner Node 24.
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          # Sprint Fase 4 CI fix (2026-07-06): el proyecto usa `npm install`
          # (sin package-lock.json). Quitamos cache de npm porque apunta a
          # un archivo inexistente y rompe el step con 'Some specified
          # paths were not resolved'. Si en el futuro se migra a `npm ci`
          # con lock file, se puede reactivar.
          cache: false

      - name: Instalar dependencias
        run: npm ci || npm install

      - name: Type-check (vue-tsc)
        run: npx vue-tsc --noEmit

      - name: Build
        run: npm run build