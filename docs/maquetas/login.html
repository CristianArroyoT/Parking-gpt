<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>solidAPP · Iniciar sesión</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] } } }
    };
  </script>
  <style>body { font-family: 'Inter', system-ui, sans-serif; }</style>
</head>
<body class="min-h-screen bg-slate-100 flex items-center justify-center p-6 antialiased">
  <a href="index.html" class="absolute top-4 left-4 text-xs text-slate-500 hover:text-slate-800">← Índice de maquetas</a>

  <div class="w-full max-w-sm">
    <div class="flex items-center gap-3 justify-center mb-8">
      <div class="h-12 w-12 rounded-xl bg-slate-900 text-white grid place-items-center font-bold text-lg">s</div>
      <div>
        <div class="font-semibold tracking-tight text-2xl text-slate-900">solidAPP</div>
        <div class="text-xs text-slate-500">Gestión de parkings</div>
      </div>
    </div>

    <div class="bg-white rounded-2xl shadow-lg p-8">
      <h1 class="text-xl font-semibold text-slate-900">Iniciar sesión</h1>
      <p class="mt-1 text-sm text-slate-500">Accede con tu email corporativo</p>

      <form class="mt-6 space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-700">Email</label>
          <input type="email" placeholder="usuario@solidapp.es"
            class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-blue-600 focus:ring-2 focus:ring-blue-100 outline-none" />
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700">Contraseña</label>
          <input type="password" placeholder="••••••••"
            class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-blue-600 focus:ring-2 focus:ring-blue-100 outline-none" />
        </div>

        <div class="flex items-center justify-between text-sm">
          <label class="inline-flex items-center gap-2 text-slate-600">
            <input type="checkbox" class="rounded border-slate-300" /> Recordarme
          </label>
          <a href="#" class="text-blue-600 hover:underline">¿Olvidaste la contraseña?</a>
        </div>

        <button type="button"
          class="w-full rounded-lg bg-slate-900 hover:bg-slate-800 text-white text-sm font-semibold py-2.5 transition">
          Iniciar sesión
        </button>
      </form>
    </div>

    <p class="mt-6 text-center text-xs text-slate-500">
      © 2026 solidAPP · Datos protegidos bajo LOPDGDD
    </p>
  </div>
</body>
</html>
