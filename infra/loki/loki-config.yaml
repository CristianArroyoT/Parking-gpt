"""Configuración mínima de Loki 2.9.0 para solidAPP.

Sprint Fase 3A (2026-07-01).

Almacenamiento local en /loki (volumen loki-data). Schema v13 con TSDB.
Retención 31 días (``retention_period: 744h``) — ajustable en producción.

Si en producción se escala, este config se reemplaza por uno con S3/GCS
y replication_factor=3. Para MVP, single-instance + filesystem.
"""
auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 744h  # 31 días
  allow_structured_metadata: true

ruler:
  storage:
    type: local
    local:
      directory: /loki/rules