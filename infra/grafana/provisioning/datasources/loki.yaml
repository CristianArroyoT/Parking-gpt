"""Provisioning del datasource Loki en Grafana.

Sprint Fase 3A (2026-07-01).

Grafana monta ``infra/grafana/provisioning:/etc/grafana/provisioning:ro``
y auto-configura este datasource al arrancar (sin clicks en UI).
URL ``http://loki:3100`` apunta al servicio ``loki`` del compose.
"""
apiVersion: 1

datasources:
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    editable: true
    jsonData:
      httpMethod: POST
      maxLines: 1000