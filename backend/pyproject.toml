[project]
name = "solidapp-backend"
version = "0.1.0"
description = "Backend de solidAPP · gestión de parkings con OCR"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "psycopg[binary]>=3.1,<4.0",
    "asyncpg>=0.29,<1.0",
    "geoalchemy2>=0.15,<1.0",
    "pydantic[email]>=2.6,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "python-jose[cryptography]>=3.3,<4.0",
    "passlib[bcrypt]>=1.7,<2.0",
    "bcrypt>=3.2,<4.0",
    "python-multipart>=0.0.9,<1.0",
    "celery[redis]>=5.3,<6.0",
    "redis>=5.0,<6.0",
    "reportlab>=4.1,<5.0",
    "jinja2>=3.1,<4.0",
    "python-dotenv>=1.0,<2.0",
    "httpx>=0.27,<1.0",
    # T-90 (2026-10-23): Pillow abre las imagenes que suben los usuarios
    # (``app/services/incident_attachments.py``). Con el pin anterior
    # (``>=10.0,<11.0``) la version instalada era la 10.4.0, con **68
    # avisos de OSV** (bombas de descompresion, desbordamientos de bufer,
    # bucles infinitos). Pillow 13.0.0 es la primera version **sin
    # ningun aviso**: medido consultando OSV para 10.4.0 (68), 11.3.0
    # (74), 12.3.0 (39) y 13.0.0 (0).
    "pillow>=13.0.0,<14.0",
    "opencv-python-headless>=4.10,<5.0",
    # T-90 (2026-10-23): el suelo de pytest estaba en 8.0, y las
    # versiones 8.x tienen un aviso de manejo del ``tmpdir`` que se
    # arregla en 9.0.3. El rango permitia instalar una version con
    # vulnerabilidad sin que nada se quejara.
    "pytest>=9.0.3,<10.0",
    # Sprint Fase 3A: logger JSON estructurado para Loki.
    "python-json-logger>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4,<1.0",
    "mypy>=1.10,<2.0",
    "faker>=24.0,<26.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC", "PT", "RET", "SIM"]
ignore = [
    "E501",   # line too long (preexistente)
    "E702",   # multiple statements on one line (semicolon)
    "I001",   # unsorted imports — autor no usa isort
    "PT001",  # pytest fixture without parentheses — preexistente
    "PT018",  # assertNotEquals — preexistente
    "RET501", # unnecessary return — preexistente
    "SIM105", # use contextlib.suppress — preexistente
    "SIM108", # use ternary — preexistente
    "UP017",  # timezone.utc → datetime.UTC — preexistente
    "UP035",  # typing.Dict/List → dict/list — preexistente
    "UP037",  # quoted annotations — preexistente
    "UP041",  # TypeAlias import — preexistente
    "UP042",  # str+Enum → StrEnum — preexistente
    "UP045",  # Optional[X] → X | None — preexistente
    "B008",   # FastAPI Depends() en default argument — patrón estándar
    # Tests preexistentes (ignora convención de pytest fixtures / mocks de API externa / aliasing):
    "N806",   # `SessionLocal = sessionmaker(...)` - patron pytest fixture / SQLAlchemy
    "N802",   # `isOpened` imita API OpenCV (`cv2.VideoCapture.isOpened()`) en test_heartbeat.py
    "F841",   # Variables asignadas pero no usadas - assertion tracking intencional en tests
    "E402",   # Imports en mitad de archivo (con prefijo `_`) - aliasing intencional para evitar leak
]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "postgres: tests que sólo tienen sentido contra PostgreSQL (el motor de producción)",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["alembic*", "tests*"]