[project]
name = "solidapp-backend"
version = "0.1.0"
description = "Backend de solidAPP · gestión de parkings con OCR"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "psycopg[binary]>=3.1,<4.0",
    "asyncpg>=0.29,<1.0",
    "geoalchemy2>=0.15,<1.0",
    "pydantic[email]>=2.6,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "python-jose[cryptography]>=3.3,<4.0",
    "passlib[bcrypt]>=1.7,<2.0",
    "bcrypt>=3.2,<4.0",
    "python-multipart>=0.0.9,<1.0",
    "celery[redis]>=5.3,<6.0",
    "redis>=5.0,<6.0",
    "reportlab>=4.1,<5.0",
    "jinja2>=3.1,<4.0",
    "python-dotenv>=1.0,<2.0",
    "httpx>=0.27,<1.0",
    "pillow>=10.0,<11.0",
    "opencv-python-headless>=4.10,<5.0",
    "pytest>=8.0,<10.0",
    # Sprint Fase 3A: logger JSON estructurado para Loki.
    "python-json-logger>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4,<1.0",
    "mypy>=1.10,<2.0",
    "faker>=24.0,<26.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC", "PT", "RET", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]